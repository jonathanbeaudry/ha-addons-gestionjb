# Add-on Home Assistant — « Proxy maison »
# Installé depuis le dépôt public : Paramètres → Modules → Boutique → (⋮) →
# Dépôts → https://github.com/<compte>/ha-addons-gestionjb
# (Historique : c'était un add-on LOCAL copié à la main dans /addons/. Le dépôt
# remplace le copier-coller dans nano par un bouton « Mettre à jour ».)
name: Proxy maison (sortie résidentielle)
version: "2.10.1"
slug: proxy_maison
description: >-
  Va chercher des pages web avec l'IP résidentielle de la maison pour le VPS
  (contourne les blocages d'IP centre de données). /fetch = HTML brut,
  /render = la page avec son JavaScript exécuté (Chromium). Verrouillé par
  jeton + liste blanche + blocage des IP privées.
# armv7 retiré en 2.0.0 : pas de build officiel de Chromium pour cette arch.
arch:
  - aarch64
  - amd64
# Réseau hôte : le port 8099 est ouvert directement sur l'hôte, ce qui rend le
# service joignable par l'add-on Cloudflared (via l'IP LAN de la machine).
host_network: true
# 2.10.0 : parler au Supervisor pour RELANCER HA quand il est tombé (/ha_redemarrer).
# `manager` est le plus petit rôle qui permet /host/reboot. Voir fetch_server.py,
# section « Relancer Home Assistant à distance ».
hassio_api: true
# 2.10.1 : chien de garde du Supervisor. L'add-on est tombé le 2026-10-08 (/render
# instable dès 21 h 23, mort à 21 h 56) et personne ne l'a relevé pendant 9 h (Les Libraires, StoryGraph et la
# vitrine de Boussole morts) : l'interrupteur « Watchdog » était à off — mis à on
# le 2026-10-09 par l'API du Supervisor. Cette URL lui permet en plus de voir un
# serveur FIGÉ (processus vivant, port muet), pas seulement un conteneur arrêté.
# /health répond 200 sans jeton.
watchdog: "http://[HOST]:[PORT:8099]/health"
hassio_role: manager
init: false
options:
  token: ""
  allowlist:
    - reddit.com
    - morningstar.com
  # true = n'importe quel lien passe (la liste blanche ci-dessus devient un
  # simple repli inutile). L'anti-SSRF reste TOUJOURS actif : les IP privées /
  # loopback / réservées restent bloquées, donc le proxy ne peut jamais servir à
  # atteindre le réseau maison, egress général ou pas.
  general_egress: true
  port: 8099
  # Coupe-circuit de Chromium. Si /render fait des siennes, le mettre à false
  # laisse /fetch (la production : Reddit, Morningstar) debout.
  render_enabled: true
  render_timeout: 45
  # /navigateur_dire (2.9.0) : le VPS envoie une phrase à ChatGPT ou à Grok,
  # dans LA conversation réglée ici (jamais choisie par le VPS). Conversation
  # vide = service fermé. Les témoins = export JSON de l'extension
  # Cookie-Editor, depuis ton propre Chrome connecté au site.
  chatgpt_conversation: ""
  chatgpt_message: "fait prochaine sur le mcp carcajou"
  chatgpt_cookies: ""
  grok_conversation: "https://grok.com/"
  grok_cookies: ""
  navigateur_max_par_jour: 30
  navigateur_garder_min: 120
  # /ha_redemarrer (2.10.0) : coupe-circuit de la relance de HA à distance.
  redemarrage_ha: true
schema:
  token: str
  allowlist:
    - str
  general_egress: bool
  port: port
  render_enabled: bool
  render_timeout: int(5,180)
  chatgpt_conversation: str?
  chatgpt_message: str?
  chatgpt_cookies: password?
  grok_conversation: str?
  grok_message: str?
  grok_cookies: password?
  navigateur_max_par_jour: int(1,200)
  navigateur_garder_min: int(1,600)
  redemarrage_ha: bool?
